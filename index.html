<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- SEO 메타 태그 및 텍스트 인코딩 설정 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍길동 | 크리에이티브 프론트엔드 포트폴리오</title>
  <meta name="description" content="사용자 경험과 인터랙션을 중시하는 프론트엔드 개발자 홍길동의 개인 포트폴리오 웹사이트입니다.">
  <meta name="keywords" content="포트폴리오, 프론트엔드 개발자, UI/UX, React, JavaScript, HTML/CSS">

  <!-- 소셜 공유 오픈그래프(OG) 메타 태그 -->
  <meta property="og:title" content="홍길동 | 크리에이티브 프론트엔드 포트폴리오">
  <meta property="og:description" content="모던 다크 슬레이트 & 글래스모피즘 테마의 개인 포트폴리오 웹사이트">
  <meta property="og:type" content="website">

  <!-- 웹 폰트 (Google Fonts: Inter & Pretendard CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 글로벌 CSS 토큰 및 리셋 스타일 -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css">

  <!-- 세분화된 모듈 컴포넌트 전용 CSS 파일들 -->
  <link rel="stylesheet" href="./css/components/header.css">
  <link rel="stylesheet" href="./css/components/hero.css">
  <link rel="stylesheet" href="./css/components/about.css">
  <link rel="stylesheet" href="./css/components/projects.css">
  <link rel="stylesheet" href="./css/components/skills.css">
  <link rel="stylesheet" href="./css/components/contact.css">
  <link rel="stylesheet" href="./css/components/modal.css">
</head>
<body>
  <!-- 1. 상단 네비게이션 헤더 마운트 레이아웃 -->
  <div id="header-container"></div>

  <!-- 2. 시맨틱 메인 콘텐츠 영역 -->
  <main id="main-content">
    <!-- 히로(Hero) 메인 상단 배너 마운트 컨테이너 -->
    <div id="hero-container"></div>

    <!-- 나만 편집 가능한 자기소개란 마운트 컨테이너 -->
    <div id="about-container"></div>

    <!-- 대표 작업물(Projects) 목록 마운트 컨테이너 -->
    <div id="projects-container"></div>

    <!-- 보유 기술 스택(Skills) 마운트 컨테이너 -->
    <div id="skills-container"></div>

    <!-- 연락처 및 푸터(Contact & Footer) 마운트 컨테이너 -->
    <div id="contact-container"></div>
  </main>

  <!-- 3. 관리자 비밀번호 및 상세보기 모달 팝업 레이아웃 -->
  <div id="modal-container"></div>

  <!-- 메인 애플리케이션 번들 스크립트 실행 (CORS 제약 없이 호환) -->
  <script src="./js/bundle.js"></script>
</body>
</html>
